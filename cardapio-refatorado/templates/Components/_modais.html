<div id="modal-metodo" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end md:items-center justify-center p-4 transition-opacity">
    <div class="bg-white w-full max-w-sm rounded-t-3xl md:rounded-3xl p-6 shadow-2xl">
        <h3 class="text-xl font-black text-center mb-6 italic tracking-tighter uppercase">Como deseja pagar?</h3>
        
        <div class="space-y-3">
            <button onclick="processarPedido('pix')" class="w-full flex items-center justify-between p-4 border-2 border-blue-600 rounded-2xl hover:bg-blue-50 active:scale-95 transition-all">
                <div class="text-left">
                    <p class="font-bold text-blue-600">Pagar com PIX</p>
                    <p class="text-[10px] text-gray-400 font-bold uppercase mt-1">Aprovação imediata</p>
                </div>
                <span class="text-2xl">⚡</span>
            </button>

            <button onclick="processarPedido('cartao_entrega')" class="w-full flex items-center justify-between p-4 border-2 border-gray-200 rounded-2xl hover:bg-gray-50 active:scale-95 transition-all">
                <div class="text-left">
                    <p class="font-bold text-gray-700">Cartão na Entrega</p>
                    <p class="text-[10px] text-gray-400 font-bold uppercase mt-1">Maquininha física</p>
                </div>
                <span class="text-2xl">💳</span>
            </button>

            <button onclick="mostrarOpcaoTroco()" class="w-full flex items-center justify-between p-4 border-2 border-gray-200 rounded-2xl hover:bg-gray-50 active:scale-95 transition-all">
                <div class="text-left">
                    <p class="font-bold text-gray-700">Dinheiro</p>
                    <p class="text-[10px] text-gray-400 font-bold uppercase mt-1">Pagamento em espécie</p>
                </div>
                <span class="text-2xl">💵</span>
            </button>
        </div>

        <div id="secao-troco" class="hidden mt-4 p-4 bg-gray-50 rounded-2xl border border-dashed border-gray-300 animate-fade-in">
            <p class="text-xs font-bold text-gray-500 mb-2 uppercase text-center">Precisa de troco para quanto?</p>
            <div class="flex gap-2">
                <input type="number" id="valor-troco" placeholder="Ex: 50" 
                    class="w-full p-3 rounded-xl border-2 border-gray-200 focus:border-green-500 outline-none font-bold text-lg text-center">
                <button onclick="processarPedido('dinheiro_entrega')" 
                        class="bg-green-600 text-white px-6 rounded-xl font-bold uppercase text-xs shadow-lg active:scale-95">Confirmar</button>
            </div>
            <p class="text-[9px] text-gray-400 mt-2 text-center">* Se não precisar de troco, deixe em branco.</p>
        </div>

        <button onclick="toggleModal('modal-metodo')" class="w-full mt-4 text-gray-400 font-bold text-xs uppercase tracking-widest text-center">Cancelar</button>
    </div>
</div>

<div id="modal-pix" class="hidden fixed inset-0 bg-black/80 z-[70] flex items-center justify-center p-4">
    <div id="conteudo-pix" class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl">
        <h3 id="titulo-pix" class="font-black mb-4 italic text-blue-600 tracking-tighter uppercase">Aguardando PIX...</h3>
        <div class="relative inline-block mb-4">
            <img id="qr-img" src="" class="w-48 h-48 mx-auto border-4 border-gray-100 rounded-xl">
        </div>
        <input type="text" id="pix-copia" readonly class="w-full p-2 bg-gray-100 rounded-lg text-[9px] mb-4 text-center border font-mono truncate">
        <button onclick="copyPix()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mb-2 active:scale-95 shadow-md">COPIAR CÓDIGO PIX</button>
        <button onclick="fecharEPagarZap()" class="w-full bg-gray-200 text-gray-600 py-3 rounded-xl font-bold text-sm">CANCELAR</button>
    </div>
</div>
<!-- ══════════════════════════════════════════════════════
     MODAL: Complementos do Produto
══════════════════════════════════════════════════════ -->
<div id="modal-complementos" class="hidden fixed inset-0 bg-black/70 z-[65] flex items-end md:items-center justify-center p-0 md:p-4">
  <div class="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
    
    <!-- Header fixo -->
    <div class="p-5 border-b border-gray-100 flex items-center justify-between shrink-0">
      <div>
        <h3 id="comp-produto-nome" class="font-black text-gray-900 text-lg italic uppercase tracking-tighter"></h3>
        <p class="text-xs text-gray-400 font-bold mt-0.5">Personalize seu pedido</p>
      </div>
      <button onclick="fecharModalComplementos()" class="text-gray-300 hover:text-gray-500 text-2xl font-black leading-none">✕</button>
    </div>

    <!-- Conteúdo rolável -->
    <div id="comp-grupos-container" class="overflow-y-auto flex-1 p-4 space-y-5"></div>

    <!-- Footer fixo -->
    <div class="p-4 border-t border-gray-100 shrink-0">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-black text-gray-600 uppercase">Preço base:</span>
        <span id="comp-preco-base" class="font-black text-gray-800"></span>
      </div>
      <div id="comp-extra-row" class="hidden flex items-center justify-between mb-3">
        <span class="text-sm font-black text-orange-600 uppercase">+ Adicionais:</span>
        <span id="comp-preco-extra" class="font-black text-orange-600"></span>
      </div>
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm font-black text-green-700 uppercase">Total:</span>
        <span id="comp-preco-total" class="font-black text-green-700 text-xl"></span>
      </div>
      <button onclick="confirmarComplementos()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-base uppercase shadow-lg active:scale-95 transition-transform">
        Adicionar ao Carrinho
      </button>
    </div>
  </div>
</div>
